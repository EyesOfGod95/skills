# Pubblica EOG su GitHub Pages sincronizzando il branch gh-pages a ogni push.
# Pages è configurato per servire dal branch gh-pages (attivato alla sua creazione).
name: Deploy EOG su GitHub Pages

on:
  push:
    branches: [main, claude/eog-personal-ai-9msn8p]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pubblica su gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan gh-pages-tmp
          git add -A
          git commit -m "Deploy EOG ${GITHUB_SHA::7}"
          git push origin gh-pages-tmp:gh-pages --force
