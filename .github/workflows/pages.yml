# Pubblica EOG su GitHub Pages.
# "enablement: true" attiva Pages da solo al primo run (permesso pages: write).
name: Deploy EOG su GitHub Pages

on:
  push:
    branches: [main, claude/eog-personal-ai-9msn8p]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
